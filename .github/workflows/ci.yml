name: RPi Test

on:
  push: # Runs tests for all branches
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clang-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format, clang-tidy, git, and avr-libc
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy git avr-libc gcc-avr

      - name: Install Arduino CLI and AVR core
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Install mcp2515 library headers
        run: |
          git clone --depth 1 https://github.com/autowp/arduino-mcp2515.git /tmp/mcp2515

      - name: Check formatting with clang-format
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f \( -name "*.ino" -o -name "*.c" -o -name "*.cpp" -o -name "*.h" \) -not -path "*/.*" -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .ino, .c, .cpp, or .h files found."
            exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"

      - name: Run clang-tidy on C/C++ sources (optional)
        run: |
          set -euo pipefail
          AVR_CORE_DIR=$(find /home/runner/.arduino15/packages/arduino/hardware/avr -path "*/cores/arduino" -type d | head -n 1)
          AVR_VARIANT_DIR=$(find /home/runner/.arduino15/packages/arduino/hardware/avr -path "*/variants/standard" -type d | head -n 1)
          SPI_DIR=$(find /home/runner/.arduino15/packages/arduino/hardware/avr -path "*/libraries/SPI/src" -type d | head -n 1)
          if [ -z "${AVR_CORE_DIR}" ] || [ -z "${AVR_VARIANT_DIR}" ] || [ -z "${SPI_DIR}" ]; then
            echo "Could not locate Arduino core, variant, or SPI header directories" >&2
            exit 1
          fi
          mapfile -d '' cc_files < <(find . -type f \( -name "*.c" -o -name "*.cpp" \) -not -path "*/.*" -print0)
          if [ ${#cc_files[@]} -gt 0 ]; then
            clang-tidy "${cc_files[@]}" -- \
              --target=avr \
              -mmcu=atmega328p \
              -I. \
              -I/tmp/mcp2515 \
              -I"${AVR_CORE_DIR}" \
              -I"${AVR_VARIANT_DIR}" \
              -I"${SPI_DIR}" \
              -isystem/usr/avr/include
          fi

  lint-python:
    name: Lint Python (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install -r requirements.txt

      - name: Ruff check
        run: ruff check --config 'extend-exclude = ["ares_can_lib/rsx_python/can_utilities.py", "functional_tests/sample_python_can/*"]' .